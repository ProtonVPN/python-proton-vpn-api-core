<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
    <policy user="root">
        <allow own="me.proton.vpn.kill_switch"/>
        <allow send_destination="me.proton.vpn.kill_switch"/>
    </policy>
    <!-- Unprivileged callers may reach the interface: the client runs as the
         desktop user. The service itself enforces ownership: once the kill
         switch is on, only the user who turned it on, or root, may change
         it. -->
    <policy context="default">
        <allow send_destination="me.proton.vpn.kill_switch"
               send_interface="me.proton.vpn.kill_switch"/>
        <!-- So the API can be inspected with busctl without root. -->
        <allow send_interface="org.freedesktop.DBus.Introspectable"/>
        <allow receive_interface="org.freedesktop.DBus.Introspectable"/>
    </policy>
</busconfig>
