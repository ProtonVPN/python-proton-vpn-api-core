<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
    <policy user="root">
        <allow own="org.freedesktop.NetworkManager.protun"/>
        <allow send_destination="org.freedesktop.NetworkManager.protun"/>
    </policy>
    <policy context="default">
        <allow send_destination="org.freedesktop.NetworkManager.protun"
               send_interface="me.proton.vpn.protun"/>
    </policy>
</busconfig>


